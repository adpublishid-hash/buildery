# Buildery — Nginx reverse proxy
# -----------------------------------------------------------------------------
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/buildery
#   sudo ln -s /etc/nginx/sites-available/buildery /etc/nginx/sites-enabled/buildery
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every "buildery.example.com" below with your real domain, then run
# Certbot (see DEPLOYMENT.md) — it rewrites this file to add the HTTPS block
# and the certificate paths automatically.
# -----------------------------------------------------------------------------

# ---- HTTP : redirect everything to HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name buildery.example.com www.buildery.example.com;

    # Lets Certbot answer the ACME http-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS : reverse proxy to the Next.js server on :3000 --------------------
# Certbot fills in ssl_certificate / ssl_certificate_key. If you configure TLS
# by hand, point them at your fullchain.pem and privkey.pem.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buildery.example.com www.buildery.example.com;

    # ssl_certificate     /etc/letsencrypt/live/buildery.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/buildery.example.com/privkey.pem;

    # Image uploads are capped at 5 MB in-app; allow a little headroom.
    client_max_body_size 20M;

    # Gzip text responses.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml;

    # Long-cache Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Historical form attachments are private and must not be served directly.
    location ^~ /uploads/form-submissions/ {
        return 404;
    }

    # Serve author-owned media uploads with a modest cache.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3011;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else → the Next.js app.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE upgrade support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # A few sensible security headers (tune the CSP for your needs).
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
